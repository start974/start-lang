[package]
name = "startlang"
version = "0.1.0"
edition = "2024"

[build-dependencies]
cc="*"
glob = "0.3.3"

[dependencies]
cst = { path = "../cst" }
errors = { path = "../errors" }
lexer = { path = "../lexer" }
location = { path = "../location" }
parser = { path = "../parser" }
pp = { path = "../pp" }
tir = { path = "../tir" }
typing = { path = "../typing" }
vm = { path = "../vm" }

clap = { version = "4.5.54", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
ariadne = { version = "0.6.0", features = ["auto-color"] }
colored = "3.0.0"
similar = "2.7.0"
tower-lsp = "0.20.0"
rustyline = "17.0.2"

[dev-dependencies]
trycmd = "0.15.11"
assert_cmd = "2.1.2"
serde_json = "1.0.149"
assert-json-diff = "2.0.2"
temp-dir = "0.1.16"
fs_extra = "1.3.0"
serde = "1.0.228"
