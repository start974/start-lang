[package]
name = "startlang"
version = "0.2.0-beta.1"
edition = "2024"

[build-dependencies]
cc="*"
glob = "0.3.3"

[dependencies]
pass = { path = "../pass" }
errors = { path = "../errors" }
ir = { path = "../ir" }
pp = { path = "../pp" }

clap = { version = "4.5.54", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
ariadne = { version = "0.6.0", features = ["auto-color"] }
colored = "3.0.0"
similar = "2.7.0"
tower-lsp = "0.20.0"
ratatui = "0.30"
ratatui-textarea = "0.9"
crossterm = "0.29"
ansi-to-tui = "8"

[dev-dependencies]
trycmd = "0.15.11"
assert_cmd = "2.1.2"
serde_json = "1.0.149"
assert-json-diff = "2.0.2"
temp-dir = "0.1.16"
fs_extra = "1.3.0"
serde = "1.0.228"
